{% set name = "mtpy-v2" %}
{% set version = "2.1.3" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6f79853655be840619f608a85d4234e8ece64e086b0fdd8dc5b297626693e4f3

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - xarray >=2024.10.0
    - matplotlib-base >=3.8
  run:
    - python >={{ python_min }}
    - aurora >=0.6.2
    - configparser
    - contextily
    - geopandas
    - matplotlib-base >=3.8
    - mt-metadata
    - mth5
    - numpy
    - pyevtk
    - pyproj
    - rasterio
    - scipy
    - simpeg >=0.25.0
    - xarray >=2024.10.0
    - bokeh
    - panel
    

test:
  imports:
    - mtpy
    - mtpy.core.mt
    - mtpy.core.mt_collection
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip
    - matplotlib-base >=3.8

about:
  home: https://github.com/MTgeophysics/mtpy-v2
  summary: Python toolkit for working with magnetotelluric data.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kujaku11
    - akirkby
